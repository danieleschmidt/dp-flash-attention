[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dp-flash-attention"
version = "1.0.0"
description = "Differentially private attention for PyTorch — Gaussian DP noise injection with Rényi accounting"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Daniel Schmidt", email = "danschmidt88@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
